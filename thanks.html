<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Thank you | World Merit Oujda Council</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/" aria-label="World Merit Oujda Council, home">
      <span class="brand-text">
        <span class="brand-name">WORLD MERIT</span>
        <span class="brand-sub">OUJDA COUNCIL</span>
      </span>
    </a>
  </div>
</header>

<main id="top">
  <section class="section">
    <div class="wrap">
      <p class="eyebrow">Message sent</p>
      <h2>Thank you for reaching out</h2>
      <p class="section-lead">Your application has been sent to the World Merit Oujda Council team. We will get back to you soon.</p>
      <a class="btn btn-orange" href="/">Back to home</a>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer-bottom">
    <span>© <span id="year">2026</span> World Merit Oujda Council</span>
    <span>A youth-led community council of World Merit in Oujda, Morocco.</span>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</html>
